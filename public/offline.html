<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRD Group HRMS</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #13213b; color: #fff;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.14); display: grid; place-items: center;
          font-size: 30px; font-weight: 700; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #c9d2e3; margin: 0 0 24px; line-height: 1.5; max-width: 32ch; }
  button { font: inherit; font-weight: 600; padding: 12px 28px; border-radius: 10px; border: 0; background: #2b50c8; color: #fff; }
</style>
</head>
<body>
  <main>
    <div class="mark">R</div>
    <h1>No connection</h1>
    <p>RRD Group HRMS needs the internet. Check your mobile data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.href='https://hrms-website-three.vercel.app'">Try again</button>
  </main>
</body>
</html>
